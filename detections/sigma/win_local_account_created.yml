title: Local User Account Created From the Command Line
id: 1c7e9a34-5d2b-4a6f-b0d8-3e4f5a6b7c03
status: experimental
description: |
  Detects net.exe / net1.exe adding a local user, a quick way for an attacker to keep access to a host.
references:
  - https://attack.mitre.org/techniques/T1136/001/
author: Shubhan Punde
date: 2026-11-24
tags:
  - attack.persistence
  - attack.t1136.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
  selection_cmd:
    CommandLine|contains|all:
      - ' user '
      - '/add'
  condition: selection_img and selection_cmd
falsepositives:
  - IT staff provisioning local accounts by hand
level: high
