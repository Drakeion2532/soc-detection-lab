title: Host or Account Discovery Tool Executed
id: 5d8e2f47-6a1c-4c3b-9e7d-5a6b7c8d9e05
name: discovery_tool_execution
status: experimental
description: Base rule. One discovery tool started; on its own this is normal admin activity.
references:
  - https://attack.mitre.org/techniques/T1033/
author: Shubhan Punde
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1033
  - attack.t1082
  - attack.t1087.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith:
      - '\whoami.exe'
      - '\systeminfo.exe'
      - '\hostname.exe'
      - '\ipconfig.exe'
      - '\net.exe'
      - '\quser.exe'
  condition: selection
falsepositives:
  - Admins troubleshooting a machine
level: informational
---
title: Burst of Host and Account Discovery Commands
id: 3f6a9b20-8c4d-4e1a-b7f2-6b7c8d9e0f06
status: experimental
description: |
  Three or more different discovery tools started by the same parent process within five minutes,
  the "who am I and where am I" pattern right after an attacker lands on a host.
author: Shubhan Punde
date: 2026-11-24
tags:
  - attack.discovery
  - attack.t1033
  - attack.t1082
  - attack.t1087.001
correlation:
  type: value_count
  rules:
    - discovery_tool_execution
  group-by:
    - ParentProcessId
  timespan: 5m
  condition:
    field: Image
    gte: 3
falsepositives:
  - IT inventory scripts
level: medium
