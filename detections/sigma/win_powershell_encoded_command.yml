title: PowerShell Launched With an Encoded Command
id: 4b1f0c2e-7d3a-4e59-9a61-1c2d3e4f5a01
status: experimental
description: |
  Detects powershell.exe started with -EncodedCommand (or a short form such as -enc / -e), which
  attackers use to hide the real command from casual log review.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: Shubhan Punde
date: 2026-11-24
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -e '
      - ' -ec '
  condition: selection_img and selection_flag
falsepositives:
  - Some management agents and installers launch encoded PowerShell; baseline them and allowlist by parent process
level: medium
